{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-md border border-gray-200 mt-10">
    <h1 class="text-xl font-bold mb-6 border-b pb-2">Edit Reading Log</h1>
    
    <form action="/log/{{ log.id }}/edit" method="post" class="space-y-4">
        
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Date Finished</label>
            <input type="date" name="date_finished" value="{{ log.date_finished }}" required 
                   class="w-full border rounded p-2 focus:ring-2 focus:ring-slate-800 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Hours Read</label>
                <input type="number" step="0.1" name="hours" value="{{ log.hours_read }}" required 
                       class="w-full border rounded p-2">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Pace</label>
                <select name="pace" class="w-full border rounded p-2 bg-white">
                    <option {% if log.pace == 'Slow' %}selected{% endif %}>Slow</option>
                    <option {% if log.pace == 'Medium' %}selected{% endif %}>Medium</option>
                    <option {% if log.pace == 'Fast' %}selected{% endif %}>Fast</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Format Used</label>
            <select name="format_consumed" class="w-full border rounded p-2 bg-white">
                <option {% if log.format_consumed == 'Physical' %}selected{% endif %}>Physical</option>
                <option {% if log.format_consumed == 'Kindle' %}selected{% endif %}>Kindle</option>
                <option {% if log.format_consumed == 'Audible' %}selected{% endif %}>Audible</option>
                <option {% if log.format_consumed == 'Libby' %}selected{% endif %}>Libby</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Notes</label>
            <textarea name="notes" rows="3" class="w-full border rounded p-2">{{ log.log_notes or '' }}</textarea>
        </div>

        <div class="bg-red-50 p-3 rounded border border-red-100">
            <label class="flex items-center text-sm text-red-700 font-bold cursor-pointer">
                <input type="checkbox" name="is_dnf" class="mr-2 w-4 h-4 text-red-600" 
                       {% if log.is_dnf %}checked{% endif %}>
                Did Not Finish (DNF)
            </label>
        </div>

        <div class="flex space-x-3 pt-4">
            <button type="submit" class="flex-1 bg-slate-800 text-white py-2 rounded font-bold hover:bg-slate-700">
                Save Changes
            </button>
            <a href="/book/{{ log.user_book_id }}" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded font-bold text-center hover:bg-gray-300">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
