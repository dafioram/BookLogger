{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-slate-800">Manually Add Book</h1>
        <a href="/search" class="text-sm text-blue-600 hover:underline font-bold">← Back to Search</a>
    </div>

    <div class="bg-white p-8 rounded-lg shadow border border-gray-200">
        <form action="/add_manual" method="post" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-1">Book Title <span class="text-red-500">*</span></label>
                    <input type="text" name="title" required class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. The unknown manuscript">
                </div>

                <div class="col-span-2 md:col-span-1">
                    <label class="block text-sm font-bold text-slate-700 mb-1">Author <span class="text-red-500">*</span></label>
                    <input type="text" name="author" required class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. John Doe">
                </div>
                
                <div class="col-span-2 md:col-span-1">
                    <label class="block text-sm font-bold text-slate-700 mb-1">Publication Year</label>
                    <input type="text" name="year" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 1995">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-6 pt-4 border-t border-gray-100">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">ISBN-13 (Optional)</label>
                    <input type="text" name="isbn13" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Page Count</label>
                    <input type="number" name="pages" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
                <div>
                     <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Format</label>
                     <select name="format_owned" class="w-full border border-gray-300 rounded px-3 py-2 text-sm bg-white">
                        <option value="Physical">Physical</option>
                        <option value="Kindle">Kindle</option>
                        <option value="Audible">Audible</option>
                        <option value="Libby eBook">Libby</option>
                     </select>
                </div>
            </div>

            <div class="pt-4">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Summary / Synopsis</label>
                <textarea name="summary" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
            </div>

            <button type="submit" class="w-full bg-slate-800 text-white font-bold py-3 rounded hover:bg-slate-700 transition shadow-lg">
                Add Book to Library
            </button>
        </form>
    </div>
</div>
{% endblock %}
