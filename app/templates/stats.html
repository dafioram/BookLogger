{% extends "base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Reading Statistics</h1>
    <form method="get" class="flex items-center space-x-2">
        <label class="text-sm font-bold text-gray-600">Year:</label>
        <select name="year" onchange="this.form.submit()" class="border rounded px-3 py-1 bg-white">
            {% for y in available_years %}
            <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
        </select>
    </form>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-blue-600 text-white p-6 rounded-lg shadow">
        <div class="text-4xl font-bold">{{ data_books|sum }}</div>
        <div class="text-blue-100 uppercase text-xs font-bold tracking-wider">Books Finished</div>
    </div>
    <div class="bg-purple-600 text-white p-6 rounded-lg shadow">
        <div class="text-4xl font-bold">{{ data_hours|sum }}</div>
        <div class="text-purple-100 uppercase text-xs font-bold tracking-wider">Hours Read</div>
    </div>
    <div class="bg-emerald-600 text-white p-6 rounded-lg shadow">
        <div class="text-4xl font-bold">{{ data_pages|sum }}</div>
        <div class="text-emerald-100 uppercase text-xs font-bold tracking-wider">Pages Read</div>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
    
    <div class="bg-white p-4 rounded-lg shadow border border-gray-200">
        <h3 class="font-bold text-gray-700 mb-4 text-center">Books Finished per Month</h3>
        <canvas id="booksChart"></canvas>
    </div>

    <div class="bg-white p-4 rounded-lg shadow border border-gray-200">
        <h3 class="font-bold text-gray-700 mb-4 text-center">Hours Read per Month</h3>
        <canvas id="hoursChart"></canvas>
    </div>
    
    <div class="bg-white p-4 rounded-lg shadow border border-gray-200 lg:col-span-2">
        <h3 class="font-bold text-gray-700 mb-4 text-center">Pages Read per Month</h3>
        <div class="h-64">
            <canvas id="pagesChart"></canvas>
        </div>
    </div>

</div>

<script>
    const labels = {{ labels|tojson }};
    
    // Books
    new Chart(document.getElementById('booksChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Books',
                data: {{ data_books|tojson }},
                backgroundColor: '#2563EB',
                borderRadius: 4
            }]
        },
        options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });

    // Hours
    new Chart(document.getElementById('hoursChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Hours',
                data: {{ data_hours|tojson }},
                backgroundColor: '#9333EA',
                borderRadius: 4
            }]
        },
        options: { scales: { y: { beginAtZero: true } } }
    });

    // Pages (New)
    new Chart(document.getElementById('pagesChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Pages',
                data: {{ data_pages|tojson }},
                backgroundColor: '#10B981', // Emerald Green
                borderRadius: 4
            }]
        },
        options: { 
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true } } 
        }
    });
</script>
{% endblock %}
