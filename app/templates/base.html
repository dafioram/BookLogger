<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookTracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-slate-800">

    <nav class="bg-slate-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                
                <a href="/" class="flex items-center space-x-2 font-bold text-xl hover:text-gray-300 transition">
                    <span>📚</span>
                    <span>BookTracker</span>
                </a>

                <div class="flex items-center space-x-6">
                    <a href="/" class="text-sm font-medium hover:text-gray-300 transition">Dashboard</a>
                    <a href="/library" class="text-sm font-medium hover:text-gray-300 transition">Library</a>
                    <a href="/stats" class="text-sm font-bold text-yellow-400 hover:text-yellow-300 transition">Stats</a>
                    
                    <a href="/search" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md shadow transition font-bold text-sm flex items-center">
                        + Add Book
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-6">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
