{% for r in results %}
<div class="flex items-start bg-white p-4 rounded-lg shadow-sm border border-gray-200">
    <img src="{{ r.cover }}" class="w-16 h-24 object-cover rounded shadow mr-4">
    <div class="flex-1">
        <h3 class="font-bold text-lg">{{ r.title }}</h3>
        <p class="text-sm text-gray-600">{{ r.author }} ({{ r.year }})</p>
        
        <div class="flex space-x-2 mt-1">
            <span class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600">{{ r.genres }}</span>
            {% if r.rating > 0 %}
            <span class="text-xs text-yellow-600 font-bold">★ {{ r.rating }}</span>
            {% endif %}
        </div>
    </div>
    
    <form hx-post="/api/add_book" hx-swap="outerHTML">
        <input type="hidden" name="google_id" value="{{ r.google_id }}">
        <input type="hidden" name="title"     value="{{ r.title }}">
        <input type="hidden" name="author"    value="{{ r.author }}">
        <input type="hidden" name="cover"     value="{{ r.cover }}">
        <input type="hidden" name="pages"     value="{{ r.pages }}">
		<input type="hidden" name="year"      value="{{ r.year }}">
        <input type="hidden" name="isbn13"    value="{{ r.isbn13 }}">
        <input type="hidden" name="summary"   value="{{ r.summary }}">
        <input type="hidden" name="genres"    value="{{ r.genres }}">
        <input type="hidden" name="rating"    value="{{ r.rating }}">
        
        <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded text-sm hover:bg-slate-700 transition">
            + Add
        </button>
    </form>
</div>
{% else %}
<p class="text-gray-500 text-center">No results found.</p>
{% endfor %}
