{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Add Books</h1>
    
    <input type="text" 
           name="query" 
           class="w-full p-4 border rounded-lg shadow-sm text-lg focus:ring-2 ring-blue-500 outline-none"
           placeholder="Search by Title, Author or ISBN..."
           hx-post="/api/search_google" 
           hx-trigger="keyup changed delay:500ms, search" 
           hx-target="#results"
           autofocus>

    <div id="results" class="mt-8 space-y-4">
        </div>
    
	<div class="text-center mt-8 pt-8 border-t border-gray-200">
		<p class="text-gray-500 mb-2">Can't find what you're looking for?</p>
		<a href="/add_manual" class="inline-block bg-white border border-gray-300 text-slate-700 font-bold px-4 py-2 rounded hover:bg-gray-50 transition">
			➕ Manually Add Book
		</a>
	</div>
</div>
{% endblock %}
