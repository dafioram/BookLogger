{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Add Books</h1>
    
    <input type="text" 
           name="query" 
           class="w-full p-4 border rounded-lg shadow-sm text-lg focus:ring-2 ring-blue-500 outline-none"
           placeholder="Search by Title, Author or ISBN..."
           hx-post="/api/search_google" 
           hx-trigger="keyup changed delay:500ms, search" 
           hx-target="#results"
           autofocus>

    <div id="results" class="mt-8 space-y-4">
        </div>
    
    <div class="mt-8 text-center text-sm text-gray-500">
        Can't find it? <a href="#" class="underline">Create Manually</a> (Not implemented in MVP)
    </div>
</div>
{% endblock %}
