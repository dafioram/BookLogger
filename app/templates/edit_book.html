{% extends "base.html" %} 

{% block content %}
<div class="max-w-2xl mx-auto">
    
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-slate-800 flex items-center gap-2">
            <span>✏️</span> Edit Book Metadata
        </h1>
        <a href="/book/{{ book.user_book_id }}" class="text-sm font-bold text-slate-400 hover:text-slate-600">
            Cancel &times;
        </a>
    </div>

    <div class="bg-white p-8 rounded-lg shadow-md border border-gray-200">
        <form action="/book/{{ book.user_book_id }}/edit" method="post" class="space-y-6">
            
            {% include "partials/book_form_fields.html" %}

            <div class="pt-6 border-t border-slate-100 flex justify-end gap-3 mt-6">
                <a href="/book/{{ book.user_book_id }}" class="px-6 py-2 rounded-lg font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md transition transform hover:scale-[1.01]">
                    Save Changes
                </button>
            </div>
            
        </form>
    </div>
</div>
{% endblock %}
